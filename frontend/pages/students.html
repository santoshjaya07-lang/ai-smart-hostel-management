<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | AI Smart Hostel</title>

    <link rel="stylesheet" href="../css/students.css">
</head>

<body>

    <main class="students-page">

        <header class="students-header">

            <div>
                <span class="eyebrow">
                    HOSTEL MANAGEMENT
                </span>

                <h1>Students.</h1>

                <p>
                    Create and manage student accounts.
                </p>
            </div>

            <button
                class="back-button"
                id="backButton"
            >
                ← Dashboard
            </button>

        </header>


        <!-- CREATE STUDENT -->

        <section class="create-student-section">

            <div class="section-heading">

                <span class="eyebrow">
                    NEW STUDENT
                </span>

                <h2>
                    Create student account
                </h2>

            </div>


            <form id="studentForm">

                <div class="form-grid">

                    <div class="input-group">

                        <label for="userId">
                            Login ID
                        </label>

                        <input
                            type="text"
                            id="userId"
                            placeholder="Example: student001"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Temporary Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="studentId">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="studentId"
                            placeholder="Example: IITPKD001"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Student name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="student@iitpkd.ac.in"
                        >

                    </div>


                    <div class="input-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Phone number"
                        >

                    </div>


                    <div class="input-group room-select-group">

                        <label for="roomId">
                            Room
                        </label>

                        <select id="roomId">

                            <option value="">
                                No room assigned
                            </option>

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="create-button"
                >
                    Create Student →
                </button>

            </form>


            <p
                id="studentMessage"
                class="student-message"
            ></p>

        </section>


        <!-- INFO -->

        <section class="info-card">

            <span class="eyebrow">
                ROOM RULE
            </span>

            <h2>
                Four students per room.
            </h2>

            <p>
                The system will automatically prevent
                a fifth student from being assigned to
                an occupied room.
            </p>

        </section>

    </main>


    <script src="../js/students.js"></script>

</body>

</html>
